apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: example-stackit-workers-eu01-1
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: example-stackit
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-machineset: example-stackit-workers-eu01-1
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: example-stackit
        machine.openshift.io/cluster-api-machineset: example-stackit-workers-eu01-1
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
    spec:
      providerSpec:
        value:
          apiVersion: stackitproviderconfig.openshift.io/v1alpha1
          kind: STACKITMachineProviderSpec
          projectID: 11111111-1111-4111-8111-111111111111
          region: eu01
          availabilityZone: eu01-1
          imageID: 22222222-2222-4222-8222-222222222222
          machineType: c2i.4
          networkID: 33333333-3333-4333-8333-333333333333
          securityGroups:
            - 44444444-4444-4444-8444-444444444444
          rootVolume:
            sizeGiB: 32
          credentialsSecret:
            name: stackit-machine-api-credentials
          userDataSecret:
            name: worker-user-data
